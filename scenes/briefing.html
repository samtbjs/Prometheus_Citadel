<!--
  MILESTONE 6: Mission Briefing scene. Reuses ARBITER's core visual (same
  __CORE_SETUP_JS__ / __CORE_IDLE_JS__ config as scenes/mentor_core.html
  and scenes/debrief.html, from the same ui/mentor_visual.py dict) plus a
  chapter-specific briefing that reveals one line at a time via the
  reusable dialogue-reveal helper (ui/dialogue.py). "Begin Investigation"
  is a normal st.button below this scene in app.py, same pattern as the
  Debrief scene's Continue button.
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#05080a;
      font-family:'Share Tech Mono','Courier New',monospace; }
    #wrap { display:flex; width:100%; height:100%; box-sizing:border-box; }
    #coreHalf { flex:0 0 38%; position:relative; }
    #panel { flex:1; position:relative; display:flex; flex-direction:column; justify-content:center;
      padding:28px 32px; margin:14px 14px 14px 0; color:#e6f1f3;
      background:linear-gradient(155deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
      border:1px solid rgba(255,255,255,0.08); border-left:2px solid __ACCENT_HEX_CSS__; border-radius:4px;
      backdrop-filter:blur(10px); box-shadow:0 10px 30px rgba(0,0,0,0.4); }
    .label { color:__ACCENT_HEX_CSS__; letter-spacing:2px; font-size:11px; margin-bottom:14px; text-transform:uppercase; }
    .chapterName { font-size:22px; font-family:'Orbitron','Share Tech Mono',sans-serif; letter-spacing:0.03em; margin-bottom:14px; }
    .dialogueLine { font-size:15px; line-height:1.6; color:#e6f1f3; margin-bottom:10px; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="coreHalf"></div>
    <div id="panel">
      <div class="label">__MENTOR_NAME__ // MISSION BRIEFING</div>
      <div class="chapterName">__CHAPTER_NAME__</div>
      __DIALOGUE_LINES_HTML__
    </div>
  </div>
  <script>
    const ACCENT_HEX = __ACCENT_HEX_JS__;
    const coreHalf = document.getElementById("coreHalf");
    const scene = new THREE.Scene();
    const BASE_FOV = 45;
    const camera = new THREE.PerspectiveCamera(BASE_FOV, 1, 0.1, 100);
    camera.position.set(0, 0, 4.2);
    camera.lookAt(0, 0, 0);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    coreHalf.appendChild(renderer.domElement);

    function sizeRenderer() {
      const w = coreHalf.clientWidth || 1, h = coreHalf.clientHeight || 1;
      renderer.setSize(w, h);
      pmFitCamera(camera, w, h, { baseFov: BASE_FOV });
    }

    scene.add(new THREE.AmbientLight(0x445566, 1.3));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
    keyLight.position.set(3, 4, 3);
    scene.add(keyLight);
    const accentLight = new THREE.PointLight(ACCENT_HEX, 1.4, 10);
    accentLight.position.set(-2, -1, 2);
    scene.add(accentLight);

    __CORE_SETUP_JS__

    function animate() {
      requestAnimationFrame(animate);
      if (!PM_REDUCED_MOTION) { __CORE_IDLE_JS__ }
      renderer.render(scene, camera);
    }
    window.addEventListener("resize", sizeRenderer);
    sizeRenderer();
    animate();

    pmSkip(gsap.timeline()
      .from("#coreHalf", { opacity: 0, duration: 0.6, ease: "power2.out" }, 0)
      .from(".label", { opacity: 0, y: -6, duration: 0.4 }, 0.15)
      .from(".chapterName", { opacity: 0, y: 8, duration: 0.4 }, 0.3));

    pmSkip(__DIALOGUE_REVEAL_JS__);
  </script>
</body>
</html>
