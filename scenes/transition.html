<!--
  Travel Transition -- shared corridor sweep scene (Milestone 5, Part C).
  __STREAKS_HTML__ streak divs come from ui/transitions.py's
  TRANSITION_CONFIG, tinted per-call by whichever accent_hex is relevant
  (a chapter's accent, or the neutral cyan default used for anything
  Command-Center-bound) -- same config-dict + shared-template pattern as
  command_center.html's __STATIONS_HTML__. Pure CSS positioning + GSAP
  tween, no THREE.js needed for this one.
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#05080a; }
    .corridor { position:relative; width:100%; height:100%; }
    .streak { position:absolute; height:3px; border-radius:2px; opacity:0; left:0; }
    .staticFrame { position:absolute; inset:0; display:none; background:__ACCENT_HEX_CSS__; opacity:0.14; }
  </style>
</head>
<body>
  <div class="corridor">
    <div class="staticFrame"></div>
    __STREAKS_HTML__
  </div>
  <script>
    if (PM_REDUCED_MOTION) {
      // Reduced motion: no streak sweep, just a static tinted frame in the
      // chapter's accent color for the same brief beat.
      document.querySelector(".staticFrame").style.display = "block";
    } else {
      document.querySelectorAll(".streak").forEach((el) => {
        const duration = parseFloat(el.dataset.duration) || 0.6;
        const delay = parseFloat(el.dataset.delay) || 0;
        gsap.fromTo(
          el,
          { x: "-30vw", opacity: 0 },
          { x: "130vw", opacity: 1, duration, delay, ease: "power2.inOut" }
        );
      });
    }
  </script>
</body>
</html>
