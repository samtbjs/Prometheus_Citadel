<!--
  Milestone 5, Part B: Mission Debrief scene. Reuses ARBITER's core visual
  (same __CORE_SETUP_JS__ / __CORE_IDLE_JS__ config as scenes/mentor_core.html,
  from the same ui/mentor_visual.py dict) alongside the fixed per-anomaly
  debrief line, and -- if this clearing unlocked a new chapter -- a GSAP
  fade/reveal of that unlock, this project's "progression" payoff moment.
  No live Python<->iframe messaging: the Continue button below this scene
  is a normal st.button, same pattern as the Command Center's real buttons
  under its (visual-only) 3D station cards.
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#05080a;
      font-family:'Share Tech Mono','Courier New',monospace; }
    #wrap { display:flex; width:100%; height:100%; box-sizing:border-box; }
    #coreHalf { flex:0 0 38%; position:relative; }
    #panel { flex:1; display:flex; flex-direction:column; justify-content:center; padding:28px 32px; color:#e6f1f3; }
    .label { color:__ACCENT_HEX_CSS__; letter-spacing:1px; font-size:12px; margin-bottom:6px; }
    .anomalyName { font-size:20px; margin-bottom:10px; }
    .mentorLine { font-size:15px; line-height:1.6; color:#e6f1f3; margin-bottom:6px; }
    .unlockBox { opacity:0; transform:translateY(8px); border:1px solid __ACCENT_HEX_CSS__;
      border-radius:6px; padding:12px 16px; margin-top:16px; }
    .unlockLabel { color:__ACCENT_HEX_CSS__; font-size:12px; letter-spacing:1px; }
    .unlockName { color:#e6f1f3; font-size:15px; margin-top:4px; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="coreHalf"></div>
    <div id="panel">
      <div class="label">__MENTOR_NAME__ // DEBRIEF</div>
      <div class="anomalyName">Anomaly Stabilized: __ANOMALY_NAME__</div>
      <div class="mentorLine">"__MENTOR_LINE__"</div>
      __UNLOCK_HTML__
    </div>
  </div>
  <script>
    const ACCENT_HEX = __ACCENT_HEX_JS__;
    const coreHalf = document.getElementById("coreHalf");
    const scene = new THREE.Scene();
    const BASE_FOV = 45;
    const camera = new THREE.PerspectiveCamera(BASE_FOV, 1, 0.1, 100);
    camera.position.set(0, 0, 4.2);
    camera.lookAt(0, 0, 0);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    coreHalf.appendChild(renderer.domElement);

    function sizeRenderer() {
      const w = coreHalf.clientWidth || 1, h = coreHalf.clientHeight || 1;
      renderer.setSize(w, h);
      pmFitCamera(camera, w, h, { baseFov: BASE_FOV });
    }

    scene.add(new THREE.AmbientLight(0x445566, 1.3));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
    keyLight.position.set(3, 4, 3);
    scene.add(keyLight);
    const accentLight = new THREE.PointLight(ACCENT_HEX, 1.4, 10);
    accentLight.position.set(-2, -1, 2);
    scene.add(accentLight);

    __CORE_SETUP_JS__

    function animate() {
      requestAnimationFrame(animate);
      if (!PM_REDUCED_MOTION) { __CORE_IDLE_JS__ }
      renderer.render(scene, camera);
    }
    window.addEventListener("resize", sizeRenderer);
    sizeRenderer();
    animate();

    pmSkip(gsap.timeline()
      .from("#coreHalf", { opacity: 0, duration: 0.6, ease: "power2.out" }, 0)
      .from(".label", { opacity: 0, y: -6, duration: 0.4 }, 0.15)
      .from(".anomalyName", { opacity: 0, y: 8, duration: 0.4 }, 0.3)
      .from(".mentorLine", { opacity: 0, y: 8, duration: 0.5 }, 0.5)
      .to(".unlockBox", { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.9));
  </script>
</body>
</html>
