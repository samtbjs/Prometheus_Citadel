<!--
  ARBITER Core -- generic reusable "mentor speaking" visual (Milestone 5,
  Part A). Same config + shared-template pattern as focal_objects.py /
  anomaly_acene.html: __CORE_SETUP_JS__ / __CORE_IDLE_JS__ come from
  ui/mentor_visual.py's MENTOR_CORE_CONFIG, __ACCENT_HEX_JS__ from
  ui/design_tokens.py's MENTOR_ACCENT via ui/scene_viewer.py. No reaction
  states here (resolved/thin/wrong stays the anomaly scene's job) -- this
  is just idle rotation, reusable wherever the mentor appears on its own.
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:transparent; }
    canvas { display:block; }
  </style>
</head>
<body>
  <script>
    const ACCENT_HEX = __ACCENT_HEX_JS__;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 4.2);
    camera.lookAt(0, 0, 0);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x445566, 1.3));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
    keyLight.position.set(3, 4, 3);
    scene.add(keyLight);
    const accentLight = new THREE.PointLight(ACCENT_HEX, 1.4, 10);
    accentLight.position.set(-2, -1, 2);
    scene.add(accentLight);

    __CORE_SETUP_JS__

    function animate() {
      requestAnimationFrame(animate);
      __CORE_IDLE_JS__
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
