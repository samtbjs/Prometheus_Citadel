<!--
  Prometheus Lab 3D Scene — vacuum_box Anomaly.

  WHAT THIS FILE IS:
  A completely self-contained HTML page. It is NOT a normal part of the
  Streamlit app's UI -- Streamlit will load this whole file inside an
  <iframe> (a "page inside a page") using components.v1.html(). That's
  why this file has its own <html>, <head>, and <body> tags, its own
  <style>, and (as of this milestone) no <script src> at all -- Three.js
  is now inlined by ui/scene_viewer.py from the vendored copy in
  static/vendor/, the same way boot.html and command_center.html already
  work. There must NEVER be a CDN link (e.g. cdnjs) in this project.

  LIVE REACTIONS (this milestone):
  ui/scene_viewer.py replaces the text __REACTION_VERDICT__ below with one
  of: "resolved", "thin", "wrong", or "" (no submission yet / neutral).
  Reading that baked-in value on load is enough -- Streamlit re-runs the
  whole page (and this component re-renders fresh) on every Submit click,
  so a new verdict always arrives as a fresh page load, no live messaging
  between Python and the iframe is needed.
    - "resolved": box calms -- fog thins, the accent point light brightens,
      the idle drift/tumble slows down, and it settles there (stable).
    - "thin" / "wrong": a brief shudder/flicker + fog thickening for about
      1.5s, then eases back to the neutral baseline. Reads as an urgent
      nudge, not a punishment -- no red "fail" screen, no shaming text.
    - "" (neutral): just the original idle drift/tumble, unchanged.
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    /* Fill the entire iframe with a dark, space-like background so
       there's no white flash/border around the 3D canvas. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05080a;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script>
    // Three.js (r128) and GSAP are inlined by ui/scene_viewer.py ahead of
    // this <script> block, from the vendored copies in static/vendor/ --
    // no CDN, matching boot.html / command_center.html.
    const REACTION_VERDICT = "__REACTION_VERDICT__"; // resolved | thin | wrong | ""
    // ---- 1. SCENE ---------------------------------------------------
    // An empty 3D stage. We also give it a background color that matches
    // the dark "diagnostic terminal" theme used everywhere else in the app.
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05080a);
    // Base/neutral fog density -- reactions below tween away from and
    // back to this value. Same recipe (FogExp2) as boot.html / command_center.html.
    const BASE_FOG_DENSITY = 0.035;
    scene.fog = new THREE.FogExp2(0x05080a, BASE_FOG_DENSITY);

    // ---- 2. CAMERA ----------------------------------------------------
    // A "PerspectiveCamera" sees the world the way a human eye/real camera
    // does (things farther away look smaller). The three numbers are:
    // field of view in degrees, aspect ratio (width/height of the view),
    // and the near/far clipping distances (how close/far it can "see").
    const camera = new THREE.PerspectiveCamera(
      50,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    // Move the camera back and up a bit, then angle it down at the box,
    // so we get a clear three-quarter view instead of staring flat-on.
    camera.position.set(3, 2, 5);
    camera.lookAt(0, 0, 0);

    // ---- 3. RENDERER ----------------------------------------------------
    // This is what actually draws the scene, through the camera, onto a
    // <canvas> element that it creates and adds to the page for us.
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (renderer.outputEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;
    if (THREE.ACESFilmicToneMapping) renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    // ---- The box itself -------------------------------------------------
    // A BoxGeometry is the box's literal shape (1x1x1 units). A
    // MeshStandardMaterial is the "skin" -- how it reacts to light,
    // which is why we picked a material that actually needs lighting
    // (a flat/unlit material would look the same everywhere and give no
    // sense of shape). Cyan tone to match the app's accent color.
    const geometry = new THREE.BoxGeometry(1.4, 1.4, 1.4);
    const material = new THREE.MeshStandardMaterial({
      color: 0x2dd6e0,
      metalness: 0.3,
      roughness: 0.4,
    });
    const box = new THREE.Mesh(geometry, material);
    scene.add(box);

    // ---- Lighting -------------------------------------------------------
    // Without any light, a MeshStandardMaterial renders pure black --
    // this is the single most common "why is my Three.js scene empty"
    // mistake, so this scene deliberately uses two lights:
    //   1. An ambient light -- soft light with no direction, coming from
    //      "everywhere" evenly, so no side of the box is ever pitch black.
    //   2. A directional light -- like sunlight, coming from one angle,
    //      which is what actually makes the box look like a 3D shape by
    //      putting a bright side and a shadowed side on it.
    const ambientLight = new THREE.AmbientLight(0x445566, 1.2);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
    keyLight.position.set(4, 5, 3);
    scene.add(keyLight);

    // Accent point light (cyan, Chapter 1 color) from the opposite side, so
    // the shadowed face of the box isn't a flat silhouette. This is also
    // the light the reaction states below brighten/flicker to sell the
    // "resolved" / "thin"/"wrong" moments.
    const BASE_ACCENT_INTENSITY = 0.9;
    const accentLight = new THREE.PointLight(0x2dd6e0, BASE_ACCENT_INTENSITY, 10);
    accentLight.position.set(-3, -1, 2.5);
    scene.add(accentLight);

    // ---- Live Reactions ---------------------------------------------------
    // reactionState.speed multiplies the idle rotation speed in the animate
    // loop below (1 = normal, <1 = calmer, >1 = agitated). GSAP tweens it
    // and the fog/light values smoothly instead of snapping instantly.
    const reactionState = { speed: 1 };

    function stabilize() {
      // "resolved": fog thins slightly, accent light brightens, motion slows.
      gsap.to(scene.fog, { density: BASE_FOG_DENSITY * 0.5, duration: 1.2, ease: "power2.out" });
      gsap.to(accentLight, { intensity: BASE_ACCENT_INTENSITY * 1.6, duration: 1.2, ease: "power2.out" });
      gsap.to(reactionState, { speed: 0.4, duration: 1.2, ease: "power2.out" });
    }

    function destabilize() {
      // "thin"/"wrong": a brief shudder/flicker + thicker fog, then eases
      // back to the neutral baseline after ~1.5s. An urgent nudge, not a
      // punishment -- no red flash, no shaming visuals.
      const shudder = gsap.timeline();
      shudder.to(scene.fog, { density: BASE_FOG_DENSITY * 1.8, duration: 0.15 }, 0);
      shudder.to(accentLight, { intensity: BASE_ACCENT_INTENSITY * 0.3, duration: 0.1, repeat: 3, yoyo: true }, 0);
      shudder.to(box.rotation, {
        z: box.rotation.z + 0.18, duration: 0.08, repeat: 5, yoyo: true, ease: "power1.inOut",
      }, 0);
      shudder.to(reactionState, { speed: 1.8, duration: 0.15 }, 0);
      // Settle back to the neutral baseline by ~1.5s total.
      shudder.to(scene.fog, { density: BASE_FOG_DENSITY, duration: 1.0, ease: "power2.out" }, 0.5);
      shudder.to(accentLight, { intensity: BASE_ACCENT_INTENSITY, duration: 1.0, ease: "power2.out" }, 0.5);
      shudder.to(reactionState, { speed: 1, duration: 1.0, ease: "power2.out" }, 0.5);
    }

    if (REACTION_VERDICT === "resolved") {
      stabilize();
    } else if (REACTION_VERDICT === "thin" || REACTION_VERDICT === "wrong") {
      destabilize();
    }
    // REACTION_VERDICT === "" (no submission yet): stays neutral, no call.

    // ---- Phase 7b: Animation loop -----------------------------------------
    // Browsers can't run our code and repaint the screen at the same time --
    // requestAnimationFrame(fn) asks the browser "call fn right before your
    // next repaint," which is why it's used instead of e.g. calling render()
    // on a setInterval timer: it stays in sync with the screen's own refresh
    // rate (usually 60 times/second), so motion looks smooth and doesn't
    // waste work drawing frames the screen isn't ready to show yet.
    const baseY = box.position.y;
    function animate() {
      requestAnimationFrame(animate);

      // Slow tumble: tiny angle added every frame, forever. Scaled by
      // reactionState.speed so verdicts can calm or agitate the motion.
      box.rotation.y += 0.0035 * reactionState.speed;
      box.rotation.x += 0.0015 * reactionState.speed;

      // Gentle up/down drift using a sine wave, so it eases back and forth
      // rather than moving at a constant speed like a bouncing ball would.
      box.position.y = baseY + Math.sin(Date.now() * 0.0006) * 0.12;

      renderer.render(scene, camera);
    }
    animate();

    // ---- Keep it looking right if the iframe itself gets resized -------
    // No renderer.render() call is needed here anymore -- the animate()
    // loop above already redraws every frame on its own, so it will pick
    // up the new size/aspect on its very next frame automatically.
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

  <!--
    Note: the old browser-side "did the CDN fail" check (a setTimeout
    that looked for `THREE === undefined`) is gone -- Three.js is now
    inlined synchronously by ui/scene_viewer.py from static/vendor/, the
    same as boot.html/command_center.html, so it's never fetched over the
    network from inside this iframe and can't fail that way anymore. The
    remaining fallback (file missing/unreadable/empty) is still handled
    Python-side, in scene_viewer.py's try/except.
  -->
</body>
</html>
