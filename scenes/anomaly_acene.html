<!--
  Phase 7a — Prometheus Lab 3D Scene (vacuum_box Anomaly only)

  WHAT THIS FILE IS:
  A completely self-contained HTML page. It is NOT a normal part of the
  Streamlit app's UI -- Streamlit will load this whole file inside an
  <iframe> (a "page inside a page") using components.v1.html(). That's
  why this file has its own <html>, <head>, and <body> tags, its own
  <style>, and loads its own copy of the Three.js library -- it can't
  reach into app.py's Python or ui/styles.py's CSS, and doesn't need to.

  WHAT THREE.JS IS DOING HERE (plain-language walkthrough):
  Three.js is a JavaScript library for drawing 3D graphics in a browser.
  To show ANY 3D picture, three things are always required:
    1. A SCENE  -- an empty 3D "stage" that objects and lights get added to.
    2. A CAMERA -- a virtual eye that decides what part of the scene we see,
                    from where, and at what angle.
    3. A RENDERER -- the thing that actually draws (renders) the scene, as
                      seen through the camera, onto the screen every frame.
  This file sets up exactly those three things, adds one box shape and two
  lights to the scene, points the camera at the box, and renders ONE frame.
  Because Phase 7a is deliberately NOT animated yet, we render that single
  frame and stop -- nothing moves, nothing loops. The box just sits there,
  which nicely fits the "frozen/floating in a vacuum" theme anyway.

  KNOWN FRAGILITY (read this if the box doesn't show up):
    - This file loads the Three.js library from a CDN (a file hosted on
      the internet, at cdnjs.cloudflare.com) via the <script src="..."> tag
      below. If the computer running this has no internet access, or a
      firewall/network blocks cdnjs.cloudflare.com, the library will fail
      to load and the page will stay blank/dark with no box and no error
      shown to the student. Opening the browser's dev tools console
      (F12 -> Console tab) inside the iframe would show a "three is not
      defined" or network error in that case.
    - Streamlit's components.v1.html() draws this in a fixed-size box
      (an iframe) whose HEIGHT is set from the Python side (in
      ui/scene_viewer.py), not from this HTML file. If the box looks
      cut off at the top or bottom, that height value is what to adjust,
      not anything in here.
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    /* Fill the entire iframe with a dark, space-like background so
       there's no white flash/border around the 3D canvas. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05080a;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <!--
    Three.js r128, loaded from cdnjs. Pinned to an exact version number
    (not "latest") on purpose -- so this scene keeps working identically
    even if a newer Three.js release later changes how things are set up.
  -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ---- 1. SCENE ---------------------------------------------------
    // An empty 3D stage. We also give it a background color that matches
    // the dark "diagnostic terminal" theme used everywhere else in the app.
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05080a);

    // ---- 2. CAMERA ----------------------------------------------------
    // A "PerspectiveCamera" sees the world the way a human eye/real camera
    // does (things farther away look smaller). The three numbers are:
    // field of view in degrees, aspect ratio (width/height of the view),
    // and the near/far clipping distances (how close/far it can "see").
    const camera = new THREE.PerspectiveCamera(
      50,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    // Move the camera back and up a bit, then angle it down at the box,
    // so we get a clear three-quarter view instead of staring flat-on.
    camera.position.set(3, 2, 5);
    camera.lookAt(0, 0, 0);

    // ---- 3. RENDERER ----------------------------------------------------
    // This is what actually draws the scene, through the camera, onto a
    // <canvas> element that it creates and adds to the page for us.
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // ---- The box itself -------------------------------------------------
    // A BoxGeometry is the box's literal shape (1x1x1 units). A
    // MeshStandardMaterial is the "skin" -- how it reacts to light,
    // which is why we picked a material that actually needs lighting
    // (a flat/unlit material would look the same everywhere and give no
    // sense of shape). Cyan tone to match the app's accent color.
    const geometry = new THREE.BoxGeometry(1.4, 1.4, 1.4);
    const material = new THREE.MeshStandardMaterial({
      color: 0x2dd6e0,
      metalness: 0.3,
      roughness: 0.4,
    });
    const box = new THREE.Mesh(geometry, material);
    scene.add(box);

    // ---- Lighting -------------------------------------------------------
    // Without any light, a MeshStandardMaterial renders pure black --
    // this is the single most common "why is my Three.js scene empty"
    // mistake, so this scene deliberately uses two lights:
    //   1. An ambient light -- soft light with no direction, coming from
    //      "everywhere" evenly, so no side of the box is ever pitch black.
    //   2. A directional light -- like sunlight, coming from one angle,
    //      which is what actually makes the box look like a 3D shape by
    //      putting a bright side and a shadowed side on it.
    const ambientLight = new THREE.AmbientLight(0x445566, 1.2);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
    keyLight.position.set(4, 5, 3);
    scene.add(keyLight);

    // A dim, cool-toned fill light from the opposite side, so the shadowed
    // face of the box isn't a flat silhouette -- a small detail, but it
    // reads much better and still costs nothing since there's no animation.
    const fillLight = new THREE.DirectionalLight(0x2dd6e0, 0.4);
    fillLight.position.set(-4, -2, -3);
    scene.add(fillLight);

    // ---- Phase 7b: Animation loop -----------------------------------------
    // Browsers can't run our code and repaint the screen at the same time --
    // requestAnimationFrame(fn) asks the browser "call fn right before your
    // next repaint," which is why it's used instead of e.g. calling render()
    // on a setInterval timer: it stays in sync with the screen's own refresh
    // rate (usually 60 times/second), so motion looks smooth and doesn't
    // waste work drawing frames the screen isn't ready to show yet.
    const baseY = box.position.y;
    function animate() {
      requestAnimationFrame(animate);

      // Slow tumble: tiny angle added every frame, forever.
      box.rotation.y += 0.0035;
      box.rotation.x += 0.0015;

      // Gentle up/down drift using a sine wave, so it eases back and forth
      // rather than moving at a constant speed like a bouncing ball would.
      box.position.y = baseY + Math.sin(Date.now() * 0.0006) * 0.12;

      renderer.render(scene, camera);
    }
    animate();

    // ---- Keep it looking right if the iframe itself gets resized -------
    // No renderer.render() call is needed here anymore -- the animate()
    // loop above already redraws every frame on its own, so it will pick
    // up the new size/aspect on its very next frame automatically.
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

  <!--
    Phase 7c — browser-side CDN failure check.

    WHY THIS BLOCK EXISTS (separate from the Python fallback in
    scene_viewer.py): Python only knows whether it could read THIS HTML
    file off disk. It has no way to know whether the browser, once it
    got this file, was actually able to reach cdnjs.cloudflare.com to
    download Three.js. If that network request fails (no internet, a
    firewall, cdnjs being down, etc.), every script above silently does
    nothing -- `THREE` is never defined, so `new THREE.Scene()` etc.
    never run, and the iframe just stays blank/dark forever with no
    error visible to the student. That's the exact "blank box" failure
    this phase exists to prevent.

    THE FIX: wait a couple of seconds, then check whether the global
    `THREE` variable exists. If it doesn't, the CDN never arrived --
    so replace this entire page's content with a plain 2D HTML/CSS
    fallback card (no Three.js needed at all for this part) styled to
    match the app's dark/cyan "diagnostic terminal" look.
  -->
  <script>
    setTimeout(() => {
      if (typeof THREE === "undefined") {
        document.body.innerHTML = `
          <div style="
            display:flex; align-items:center; justify-content:center;
            width:100%; height:100%; box-sizing:border-box; padding:24px;
            background:#05080a; font-family:monospace;
          ">
            <div style="
              border:1px solid #2dd6e0; border-radius:6px; padding:20px 24px;
              max-width:420px; color:#e6f1f3; text-align:center;
            ">
              <div style="color:#2dd6e0; font-weight:bold; letter-spacing:1px; margin-bottom:10px;">
                [ 3D VISUAL FEED OFFLINE ]
              </div>
              <div style="color:#8aa0aa; font-size:14px; line-height:1.5;">
                A box floats motionless in a vacuum chamber, with nothing touching it.
              </div>
            </div>
          </div>`;
      }
    }, 2500);
  </script>
</body>
</html>
