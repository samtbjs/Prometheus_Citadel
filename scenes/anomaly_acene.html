<!--
  Prometheus Lab 3D Scene — GENERIC anomaly reaction template.

  MILESTONE 4: generalized from the original vacuum_box-only file into a
  reusable template for ALL anomalies. The camera/lighting/fog rig and the
  resolved/thin/wrong reaction TIMING+FEEL are unchanged from the original
  vacuum_box scene. What's now a parameter (filled in by
  ui/focal_objects.py + ui/scene_viewer.py before this file is sent to the
  browser):
    __ACCENT_HEX_JS__   e.g. 0x2dd6e0 — this chapter's accent, used for the
                         accent light + the "resolved" flash/glow color.
    __ACCENT_HEX_CSS__  e.g. "#2dd6e0" — same color as a CSS string.
    __FOCAL_SETUP_JS__  builds this anomaly's focal object(s) into
                         `focalGroup`, and pushes every MeshStandardMaterial
                         that should glow on reaction into `reactiveMeshes`.
    __IDLE_TICK_JS__    this anomaly's own idle motion, run once per frame.
    __REACTION_VERDICT__ same as before: "resolved" / "thin" / "wrong" / "".

  Still no CDN — Three.js/GSAP are inlined by scene_viewer.py from
  static/vendor/, and there's still no live Python<->iframe messaging: a
  new verdict always arrives as a fresh page load on the next Streamlit
  rerun, so baking it in once on load is enough.
    - "resolved": reactiveMeshes glow toward this chapter's accent color,
      the accent light brightens, fog thins, motion eases to a calm drift.
    - "thin"/"wrong": a brief amber shudder (shared warning color, not
      chapter-specific — reads as a nudge, not a fail state) + fog
      thickening, then eases back to neutral by ~1.5s.
    - "" (neutral): just this anomaly's own idle motion, unchanged.
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#05080a; }
    canvas { display:block; }
  </style>
</head>
<body>
  <div id="reactionFlash" style="
    position:fixed; inset:0; pointer-events:none; z-index:10;
    background:radial-gradient(circle at 50% 55%, transparent 35%, currentColor 145%);
    opacity:0; color:#2dd6e0;
  "></div>
  <script>
    const REACTION_VERDICT = "__REACTION_VERDICT__"; // resolved | thin | wrong | ""
    const ACCENT_HEX = __ACCENT_HEX_JS__;
    const ACCENT_CSS = "__ACCENT_HEX_CSS__";
    const flashEl = document.getElementById("reactionFlash");

    // ---- 1. SCENE / CAMERA / RENDERER (identical rig for every anomaly) --
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05080a);
    const BASE_FOG_DENSITY = 0.035;
    scene.fog = new THREE.FogExp2(0x05080a, BASE_FOG_DENSITY);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(3, 2, 5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (renderer.outputEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;
    if (THREE.ACESFilmicToneMapping) renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    // ---- Lighting (identical rig, accent color now parametrized) --------
    const ambientLight = new THREE.AmbientLight(0x445566, 1.2);
    scene.add(ambientLight);
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
    keyLight.position.set(4, 5, 3);
    scene.add(keyLight);
    const BASE_ACCENT_INTENSITY = 0.9;
    const accentLight = new THREE.PointLight(ACCENT_HEX, BASE_ACCENT_INTENSITY, 10);
    accentLight.position.set(-3, -1, 2.5);
    scene.add(accentLight);
    const accentColor = new THREE.Color(ACCENT_HEX);

    // ---- 2. FOCAL OBJECT (per-anomaly, see ui/focal_objects.py) ---------
    const focalGroup = new THREE.Group();
    scene.add(focalGroup);
    const reactiveMeshes = []; // MeshStandardMaterials that glow on reaction
    __FOCAL_SETUP_JS__

    // ---- 3. Live Reactions (generic — same timing/feel as the original
    // vacuum_box scene, now driven by reactiveMeshes[] + focalGroup instead
    // of one hardcoded box/material) ---------------------------------------
    const reactionState = { speed: 1 };

    function stabilize() {
      flashEl.style.color = ACCENT_CSS;
      gsap.fromTo(flashEl, { opacity: 0 }, { opacity: 0.45, duration: 0.25, yoyo: true, repeat: 1, ease: "power1.inOut" });
      reactiveMeshes.forEach((mat) => {
        gsap.fromTo(mat.emissive, { r: 0, g: 0, b: 0 }, {
          r: accentColor.r * 0.9, g: accentColor.g * 0.9, b: accentColor.b * 0.9,
          duration: 0.35, yoyo: true, repeat: 1, ease: "power1.inOut",
        });
      });
      gsap.to(focalGroup.scale, { x: 1.12, y: 1.12, z: 1.12, duration: 0.35, yoyo: true, repeat: 1, ease: "power1.inOut" });
      gsap.to(scene.fog, { density: BASE_FOG_DENSITY * 0.25, duration: 1.2, ease: "power2.out" });
      gsap.to(accentLight, { intensity: BASE_ACCENT_INTENSITY * 3.2, duration: 0.5, ease: "power2.out" });
      gsap.to(reactionState, { speed: 0.15, duration: 1.2, ease: "power2.out" });
    }

    function destabilize() {
      flashEl.style.color = "#fbbf24";
      const baseX = focalGroup.position.x, baseZ = focalGroup.position.z;
      const shudder = gsap.timeline();
      shudder.to(flashEl, { opacity: 0.4, duration: 0.08, repeat: 3, yoyo: true }, 0);
      reactiveMeshes.forEach((mat) => {
        shudder.to(mat.emissive, { r: 0.6, g: 0.35, b: 0, duration: 0.08, repeat: 3, yoyo: true }, 0);
      });
      shudder.to(accentLight, { intensity: BASE_ACCENT_INTENSITY * 0.2, duration: 0.08, repeat: 3, yoyo: true }, 0);
      shudder.to(scene.fog, { density: BASE_FOG_DENSITY * 2.4, duration: 0.15 }, 0);
      shudder.to(focalGroup.rotation, { z: focalGroup.rotation.z + 0.28, duration: 0.07, repeat: 6, yoyo: true, ease: "power1.inOut" }, 0);
      shudder.to(focalGroup.position, { x: baseX + 0.15, z: baseZ + 0.1, duration: 0.06, repeat: 6, yoyo: true, ease: "power1.inOut" }, 0);
      shudder.to(reactionState, { speed: 2.2, duration: 0.15 }, 0);
      shudder.to(flashEl, { opacity: 0, duration: 1.0, ease: "power2.out" }, 0.5);
      reactiveMeshes.forEach((mat) => {
        shudder.to(mat.emissive, { r: 0, g: 0, b: 0, duration: 1.0, ease: "power2.out" }, 0.5);
      });
      shudder.to(scene.fog, { density: BASE_FOG_DENSITY, duration: 1.0, ease: "power2.out" }, 0.5);
      shudder.to(accentLight, { intensity: BASE_ACCENT_INTENSITY, duration: 1.0, ease: "power2.out" }, 0.5);
      shudder.to(focalGroup.position, { x: baseX, z: baseZ, duration: 1.0, ease: "power2.out" }, 0.5);
      shudder.to(reactionState, { speed: 1, duration: 1.0, ease: "power2.out" }, 0.5);
    }

    if (REACTION_VERDICT === "resolved") {
      stabilize();
    } else if (REACTION_VERDICT === "thin" || REACTION_VERDICT === "wrong") {
      destabilize();
    }

    // ---- 4. Animation loop (idle motion is per-anomaly) ------------------
    function animate() {
      requestAnimationFrame(animate);
      __IDLE_TICK_JS__
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
